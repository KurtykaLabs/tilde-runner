name: Tinfoil Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tinfoil-prepare-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout configuration
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Require completed configuration and a new version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -s tinfoil-config.yml || { echo '::error::Hosted configuration is not ready; the example cannot be released.'; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo '::error::Invalid release version'; exit 1; }
          grep -Eq 'image: *"?ghcr.io/tildeapp/tilde-runner@sha256:[0-9a-f]{64}"? *$' tinfoil-config.yml
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"; then
            echo '::error::Release tag already exists'
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi

      - name: Create release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - name: Dispatch measured publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run tinfoil-release-publish.yml --ref "$VERSION"
