cvm-version: 0.14.12
cpus: 2
memory: 8192

keyserver-url: https://keys.tildeapp.ai

networks:
  backend:
    egress: allowlist
    allow:
      - vikrckqkpxfltoodrpui.supabase.co
      - inference.tinfoil.sh
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh

# The persistent disk ("Tilde Runner Disk", attached to the `disk` mount) is encrypted inside the
# enclave with a secret this keyserver releases to approved releases only; the enclave never
# generates or stores it. The runner keeps its sealed state file on it (TDE-320), anchored in
# the Supabase state record so a rolled-back disk is refused.
volumes:
  - name: disk
    key-secret: TILDE_RUNNER_DISK_KEY
    # The mount root is owned by this uid, so the container user (10001) can create its state
    # directory; without it the root-owned mount made m1.29 exit with RUNNER_STATE_DISK_UNWRITABLE.
    owner: 10001

containers:
  - name: tilde-runner
    image: ghcr.io/tildeapp/tilde-runner@sha256:895f713792f06c64d825cd8d49c4630c404ba4f4ead01cba6c2c1164c575a254
    command: [hosted]
    user: "10001:10001"
    read_only: true
    networks: [backend]
    env:
      - TILDE_RUNNER_STATE: "/state/runner"
      # First release with the volume only: lets an empty disk import the bridge record once.
      # The next release drops it, so a lost disk can never re-import a restored bridge record.
      - TILDE_RUNNER_IMPORT_BRIDGE: "1"
    secrets:
      - TILDE_RUNNER_CONFIG
      - TILDE_RUNNER_UNLOCK
      - TINFOIL_API_KEY
    tmpfs:
      /state: "size=128m,mode=0700,uid=10001,gid=10001"
    volumes:
      - disk:/disk
    # The image carries no HTTP client; the binary checks its own /health on the listen port.
    healthcheck:
      test: ["CMD", "tilde-runner", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

shim:
  upstream-port: 8937
  paths:
    - /health
    - /v1/identity
    - /v1/activate
    - /v1/commands
    - /v1/progress-stream
    - /v1/guard
    - /v1/recovery
