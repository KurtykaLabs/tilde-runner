cvm-version: 0.14.12
cpus: 2
memory: 8192

keyserver-url: https://keys.tildeapp.ai

networks:
  backend:
    egress: allowlist
    allow:
      - vikrckqkpxfltoodrpui.supabase.co
      - inference.tinfoil.sh
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh

containers:
  - name: tilde-runner
    image: ghcr.io/tildeapp/tilde-runner@sha256:b827d3c3493da3aa17758c986e3b3218ffa6a5da19269eaab645376369a7dfe2
    command: [hosted]
    user: "10001:10001"
    read_only: true
    networks: [backend]
    env:
      - TILDE_RUNNER_STATE: "/state/runner"
    secrets:
      - TILDE_RUNNER_CONFIG
      - TILDE_RUNNER_UNLOCK
      - TINFOIL_API_KEY
    tmpfs:
      /state: "size=128m,mode=0700,uid=10001,gid=10001"
    # The persistent disk is attached here and left unused until the runner's durable state
    # moves onto it (TDE-320); the runner still keeps its state under /state.
    volumes:
      - disk:/disk
    # The image carries no HTTP client; the binary checks its own /health on the listen port.
    healthcheck:
      test: ["CMD", "tilde-runner", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

shim:
  upstream-port: 8937
  paths:
    - /health
    - /v1/identity
    - /v1/activate
    - /v1/commands
    - /v1/progress-stream
    - /v1/guard
    - /v1/recovery
