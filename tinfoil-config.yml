cvm-version: 0.14.12
cpus: 2
memory: 8192

keyserver-url: https://keys.tildeapp.ai

networks:
  backend:
    egress: allowlist
    allow:
      - vikrckqkpxfltoodrpui.supabase.co
      - inference.tinfoil.sh
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh

containers:
  - name: tilde-runner
    image: ghcr.io/tildeapp/tilde-runner@sha256:43b209440be4989d64a1b4368490bec07bd2d60ba35eedca6402b3c4cb8e995d
    command: [hosted]
    user: "10001:10001"
    read_only: true
    networks: [backend]
    env:
      - TILDE_RUNNER_STATE: "/state/runner"
    secrets:
      - TILDE_RUNNER_CONFIG
      - TILDE_RUNNER_UNLOCK
    tmpfs:
      /state: "size=128m,mode=0700,uid=10001,gid=10001"

shim:
  upstream-port: 8937
  paths:
    - /health
    - /v1/identity
    - /v1/activate
    - /v1/commands
